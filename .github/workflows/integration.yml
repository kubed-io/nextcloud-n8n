name: 🔗 Integration

# Integration tests (saga §5) — prove the real wiring the unit suite mocks out,
# on a live Nextcloud + n8n. Framework: **Behat** (the Nextcloud-native
# integration framework, per nextcloud/deck), run from tests/integration/. Behat
# drives `occ` and (later stages) NC's API + the n8n REST API, and asserts both
# sides. Its BUILT-IN junit formatter emits JUnit XML, which the same
# EnricoMi reporter the unit suite uses turns into a sticky PR comment + summary.
#
# Setup follows the official apps: check out nextcloud/server, mount this app
# into apps/n8n_sync, install on SQLite. n8n runs as a GHA services: container
# (pre-built image — the services feature fits it). docker-compose.yaml is NOT
# used in CI (devcontainer only; saga §4a).

on:
  pull_request:
    branches:
    - main
    paths:
    - .github/workflows/integration.yml
    - appinfo/**
    - lib/**
    - templates/**
    - features/**
    - tests/integration/**
    - composer.json
  push:
    branches:
    - main

permissions:
  contents: read
  # Behat results → sticky PR comment + check run (EnricoMi), like the unit suite.
  checks: write
  pull-requests: write

concurrency:
  group: integration-${{ github.ref }}
  cancel-in-progress: true

# Static values here so `run:` steps are pure bash reading $VARS — never inline
# Github templating (see CONTRIBUTING.md "Workflow authoring conventions").
env:
  APP_ID: n8n_sync
  N8N_URL: http://localhost:5678
  NC_ADMIN_USER: admin
  NC_ADMIN_PASS: admin

jobs:

  # WHICH NEXTCLOUDS THIS RUN COVERS, decided by what triggered it.
  #
  # A PR runs the CEILING ONLY. That is where the work is aimed and where a real
  # break shows up, and it keeps review cheap. `main` runs every major in info.xml's
  # range — floor, middle and ceiling — so the whole claim is executed on every merge
  # instead of once per push to every branch.
  #
  # The bet, stated plainly so it can be revisited: a change that works on the newest
  # Nextcloud and breaks an older one is RARE, and when it happens it is a bug found
  # after merge rather than a regression shipped — `main` is the gate before a
  # release, not the PR. If that stops being true, move the range back onto the PR
  # and pay the legs.
  #
  # Computed here rather than with an `if` on the matrix, because a matrix cannot be
  # conditioned in place — a job has to hand it over as JSON.
  versions:
    name: Which Nextclouds
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.pick.outputs.matrix }}
    steps:
    - name: Pick the server versions for this trigger
      id: pick
      env:
        # Bound, not interpolated into the script — see the env: note at the top.
        EVENT: ${{ github.event_name }}
      run: |
        if [ "$EVENT" = "pull_request" ]; then
          matrix='["stable34"]'
        else
          matrix='["stable32", "stable33", "stable34"]'
        fi
        echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
        echo "Nextcloud versions for this $EVENT run: $matrix" >> "$GITHUB_STEP_SUMMARY"

  integration:
    name: Integration ${{ matrix.suite }} (${{ matrix.server-versions }})
    runs-on: ubuntu-latest
    needs: versions

    # ── THE SUITE AXIS DIVIDES THE SCENARIOS ─────────────────────────────────
    # Four legs each run a slice of features/, in parallel, so wall time is set
    # by the longest slice rather than by the sum. The split is by FILENAME
    # (behat.dist.yml explains why a tag partition leaks), and
    # `bin/check-suites.sh` fails the quality job if features/ is not covered
    # exactly once.
    #
    # It is worth an axis here because the fixed cost is small and the Behat run
    # is not: one Nextcloud install, one n8n container and one key mint per leg,
    # against ~90 live scenarios of which `tags` alone is 31.
    #
    # A STORAGE-BACKEND AXIS (Team Folder vs admin-owned) IS NOW UNBLOCKED but
    # deliberately not here. It was impossible while `add-mapping` merely
    # persisted — the harness made the folder itself with MKCOL, which on a Team
    # Folder is the wrong folder entirely. Creating a mapping now provisions its
    # folder, and groupfolders is installed below, so the axis is a matrix line
    # away. It doubles the legs, so it gets its own run rather than riding on a
    # behaviour change, where a failure would be ambiguous.
    #
    # fail-fast: false is load-bearing. With it on, one flaky leg cancels the
    # others and you lose the signal from the legs that were fine.
    strategy:
      fail-fast: false
      matrix:
        # A VERSION WE ADVERTISE AND NEVER EXECUTE IS A CLAIM, NOT A FACT — and
        # "33" is not one thing: a sibling app hit behaviour that differs between
        # 33.0.4 and 33.0.8, which cost hours because CI and the live instance sat
        # on different patch releases. Which versions run is decided by the
        # `versions` job above. SQLite is the fast integration path.
        server-versions: ${{ fromJSON(needs.versions.outputs.matrix) }}
        suite: [admin, authoring, lifecycle, tags, core]

    services:
      # n8n with the instance owner pre-provisioned via env (no signup wizard,
      # saga §4a.1) — a background container via the GHA services feature.
      n8n:
        image: docker.n8n.io/n8nio/n8n:latest
        ports:
        - 5678:5678
        env:
          N8N_INSTANCE_OWNER_MANAGED_BY_ENV: "true"
          N8N_INSTANCE_OWNER_EMAIL: owner@example.com
          N8N_INSTANCE_OWNER_FIRST_NAME: Test
          N8N_INSTANCE_OWNER_LAST_NAME: Owner
          # bcrypt hash of "n8npassword" (see .env.example).
          N8N_INSTANCE_OWNER_PASSWORD_HASH: $2y$12$M/JhYL51spvMK3uMO8iraOSbWKqIkLldhcaA8Y2TzPAhZVQdV0Tju
          N8N_DIAGNOSTICS_ENABLED: "false"
          N8N_HIRING_BANNER_ENABLED: "false"
        options: >-
          --health-cmd "wget -q -O - http://localhost:5678/healthz | grep -q ok"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 40
          --health-start-period 20s

    steps:
    # ── Provision: install everything up front, before any action runs ───────
    - name: Checkout server
      uses: actions/checkout@v7
      with:
        repository: nextcloud/server
        ref: ${{ matrix.server-versions }}
        submodules: true

    - name: Checkout app into apps/
      uses: actions/checkout@v7
      with:
        path: apps/${{ env.APP_ID }}

    - name: Set up PHP
      uses: shivammathur/setup-php@v2
      with:
        # Match the production pod / the rest of our CI.
        php-version: '8.4'
        extensions: mbstring, iconv, fileinfo, intl, sqlite, pdo_sqlite, gd, zip, curl, xml
        coverage: none
        tools: composer:v2

    - name: Install Behat deps
      working-directory: apps/${{ env.APP_ID }}/tests/integration
      run: composer install --prefer-dist --no-progress

    - name: Install Nextcloud (SQLite)
      run: |
        mkdir -p data
        ./occ maintenance:install \
          --database=sqlite \
          --admin-user="$NC_ADMIN_USER" \
          --admin-pass="$NC_ADMIN_PASS"
        ./occ config:system:set trusted_domains 1 --value=localhost
        # WebDAV scenarios reach NC over HTTP at localhost:8080 (see below), so
        # that host:port must be trusted too.
        ./occ config:system:set trusted_domains 2 --value=localhost:8080
        ./occ config:system:set loglevel --type=integer --value=0

    # TEAM FOLDERS ARE OPT-IN, AND THE SUITE HAS TO BE ABLE TO OPT IN.
    #
    # groupfolders is an optional app, which is exactly why `use_team_folder`
    # defaults to FALSE: the default mapping must be one that provisions on a
    # stock Nextcloud. It briefly defaulted to true here, which made the default
    # the one backend a plain install cannot create.
    #
    # So this install is not there to serve the default — it is there so the
    # scenarios that NAME `| storage | team folder |` have something to run
    # against. Without it those rows would be unrunnable and the Team Folder path
    # would go uncovered, which is how a Team Folder mapping once came to be
    # *storable* on an instance that could never make one.
    #
    # WHAT IS NOT COVERED, AND IS WORTH KNOWING: every leg has groupfolders, so
    # nothing here proves the app survives on a server WITHOUT it. That is a real
    # exposure — TeamFolderService resolves the groupfolders FQCN lazily for
    # precisely this reason, and a guard with no test behind it is one refactor
    # from being deleted. It wants one cheap leg, not a second full axis.
    - name: Install Team Folders (groupfolders)
      run: |
        ./occ app:install groupfolders
        ./occ app:enable groupfolders
        ./occ app:list | grep -i groupfolders

    # loglevel 0 above is deliberate: the "Nextcloud log on failure" step is the only
    # window into a failing integration run, and at the default level (2 = Warning) a
    # listener that decides to do nothing writes nothing — so a silent bail and a
    # listener that never fired look identical. That cost a full diagnostic cycle on
    # the trash-purge hook.
    #
    # ── Serve: occ-only scenarios need no HTTP, but the WebDAV channel (file
    # create/PROPFIND, the create/delete/rename listeners) does. PHP's built-in
    # server is enough for DAV; no nginx/fpm needed. Backgrounded, then waited on.
    - name: Start Nextcloud (php built-in server)
      run: |
        php -S localhost:8080 -t "$GITHUB_WORKSPACE" >/tmp/nc-web.log 2>&1 &
        echo "NC_WEB_PID=$!" >> "$GITHUB_ENV"
        for i in $(seq 1 30); do
          if curl -fsS -o /dev/null "$NC_BASE_URL/status.php"; then echo "NC web up"; exit 0; fi
          sleep 2
        done
        echo "NC web server did not come up" >&2; cat /tmp/nc-web.log >&2; exit 1
      env:
        NC_BASE_URL: http://localhost:8080

    # ── Readiness: wait for the n8n service container ────────────────────────
    - name: Wait for n8n
      run: |
        for i in $(seq 1 40); do
          if curl -fsS "$N8N_URL/healthz" | grep -q ok; then echo "n8n healthy"; exit 0; fi
          sleep 3
        done
        echo "n8n did not become healthy" >&2; exit 1

    # ── Act: everything provisioned and ready — now do the work ──────────────
    # PREREQUISITE (not a feature): obtain a valid n8n API key so the tests can
    # act as an admin who already has one. How the key is created is out of the
    # app's scope — this is pure test setup. Fails the job loudly if no key, so
    # we never run the suite without one. The key is exposed as a step output for
    # later steps; it is NOT stored anywhere.
    - name: Mint n8n API key (prerequisite)
      id: n8n_key
      env:
        N8N_OWNER_EMAIL: owner@example.com
        N8N_OWNER_PASSWORD: n8npassword
      run: |
        key="$(bash apps/$APP_ID/tests/integration/bin/mint-n8n-key.sh)"
        if [ -z "$key" ]; then echo "no API key minted" >&2; exit 1; fi
        echo "::add-mask::$key"
        echo "key=$key" >> "$GITHUB_OUTPUT"
        echo "✅ n8n API key obtained (length ${#key})"

    # PREREQUISITE control case: load example workflows into n8n through n8n's OWN
    # API (not via the app under test), so mapping/pull scenarios have real,
    # pre-existing tagged workflows to act on.
    - name: Preload example workflows into n8n (prerequisite)
      env:
        N8N_API_KEY: ${{ steps.n8n_key.outputs.key }}
      run: bash apps/$APP_ID/tests/integration/bin/preload-n8n.sh

    # Behat runs from the integration dir; OCC points back at the server root so
    # `occ` resolves. Formatters (pretty → stdout, junit → junit/) are configured
    # in behat.dist.yml, so no --format flags needed here.
    #
    # No --tags: the status filter lives in behat.dist.yml and a CLI --tags would
    # REPLACE it rather than add to it. check-suites.sh pins the two together the
    # moment a leg ever needs to pass one.
    - name: Run Behat
      working-directory: apps/${{ env.APP_ID }}/tests/integration
      env:
        OCC: php ${{ github.workspace }}/occ
        NC_BASE_URL: http://localhost:8080
        # The minted key, available to scenarios as an "admin already has a key".
        N8N_API_KEY: ${{ steps.n8n_key.outputs.key }}
        # Bound here rather than interpolated into `run:` — a `${{ }}` inside a
        # shell script is substituted BEFORE the shell sees it, which mixes
        # templating with logic and is an injection seam. Read as a plain $VAR.
        SUITE: ${{ matrix.suite }}
      run: vendor/bin/behat --config behat.dist.yml --suite="$SUITE"

    # ONE RESULT FOR THE WHOLE RUN, NOT FOUR. Each leg only UPLOADS its JUnit XML;
    # the publish job below collects them and reports once. Publishing per leg
    # would produce four checks and four PR comment updates for one test run,
    # which buries the answer to "did the suite pass?" under the mechanics of how
    # it was split.
    #
    # `if: always()` so a failing leg still contributes its results — a leg that
    # fails is exactly the one whose report you want.
    - name: Upload JUnit results
      if: always()
      uses: actions/upload-artifact@v7
      with:
        # Unique per leg: artifacts with the same name collide.
        name: junit-${{ matrix.server-versions }}-${{ matrix.suite }}
        path: apps/${{ env.APP_ID }}/tests/integration/junit/*.xml
        retention-days: 7
        if-no-files-found: error

    # Prints a READABLE SLICE, not the whole file. The suite runs at loglevel 0, which
    # is what makes a silent listener bail visible at all — but it also means
    # `cat nextcloud.log` is ~18k lines of JSON that takes minutes to render and buries
    # the failure it exists to reveal. Diagnostics nobody can read are not diagnostics.
    #
    # So: this app's own entries and anything at warning-or-worse, one line each, most
    # recent last. The complete log is uploaded as an artifact below for the rare case
    # the slice is not enough.
    - name: Nextcloud log on failure
      if: failure()
      run: |
        if [ ! -f data/nextcloud.log ]; then
          echo "no nextcloud.log"
        else
          echo "── n8n_sync entries (last 60) ──"
          grep -F '"app":"n8n_sync"' data/nextcloud.log \
            | tail -60 \
            | jq -r '"\(.time) [\(.level)] \(.message) \(.exception.Message // "")"' \
            || echo "(none)"
          echo
          echo "── warning-or-worse from any app (last 40) ──"
          jq -c -r 'select(.level >= 2) | "\(.time) [\(.level)] \(.app): \(.message) \(.exception.Message // "")"' \
            data/nextcloud.log 2>/dev/null | tail -40 || echo "(none)"
          echo
          echo "── full log: see the nextcloud-log artifact ($(wc -l < data/nextcloud.log) lines) ──"
        fi
        echo "── php built-in server log (last 40) ──"
        if [ -f /tmp/nc-web.log ]; then tail -40 /tmp/nc-web.log; else echo "no nc-web.log"; fi

    - name: Upload full Nextcloud log on failure
      if: failure()
      uses: actions/upload-artifact@v7
      with:
        name: nextcloud-log-${{ matrix.suite }}
        path: data/nextcloud.log
        if-no-files-found: ignore
        retention-days: 7

  # ── one report for the whole matrix ────────────────────────────────────────
  # This is the action's own documented matrix pattern, and it needs NO XML
  # merging: `files` is a glob and the action aggregates across every file it
  # matches.
  publish-integration-results:
    name: Integration results
    needs: integration
    if: always()
    runs-on: ubuntu-latest
    permissions:
      checks: write
      pull-requests: write
      contents: read

    steps:
    # NO `merge-multiple`. Behat names its report after the SUITE, so every leg
    # writes a differently-named file today — but the moment a second axis lands
    # (the storage backend is coming), two legs share a suite name and
    # `merge-multiple: true` would flatten them into one directory where the
    # second download silently overwrites the first. That produced a green report
    # over a red matrix on the sibling repo. Left off, each artifact lands in
    # `junit/<artifact-name>/`, unique by construction.
    - name: Download every leg's results
      uses: actions/download-artifact@v8
      with:
        path: junit
        pattern: junit-*

    # The guard, because that failure mode is SILENT — the report looks healthy
    # and simply describes a different, smaller run. One leg uploads exactly one
    # suite report, so any collision shows up as fewer files than directories.
    - name: Every leg is present
      run: |
        dirs=$(find junit -mindepth 1 -maxdepth 1 -type d | wc -l)
        files=$(find junit -name '*.xml' | wc -l)
        echo "legs: $dirs, reports: $files"
        find junit -name '*.xml' | sort
        if [ "$dirs" -eq 0 ]; then echo "::error::no leg uploaded a report"; exit 1; fi
        if [ "$dirs" -ne "$files" ]; then
          echo "::error::$dirs legs but $files reports — results are being overwritten"
          exit 1
        fi

    - name: Publish integration results
      uses: EnricoMi/publish-unit-test-result-action@v2
      with:
        check_name: Integration test results
        files: junit/**/*.xml
        comment_mode: always
        # The legs already fail the workflow on a failing scenario; this job
        # exists to REPORT, so it must not turn a reporting hiccup into a second
        # red X for the same failure.
        action_fail: false
