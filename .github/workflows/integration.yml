name: 🔗 Integration

# Integration tests (saga §5) — prove the real wiring the unit suite mocks out,
# on a live Nextcloud + n8n. Framework: **Behat** (the Nextcloud-native
# integration framework, per nextcloud/deck), run from tests/integration/. Behat
# drives `occ` and (later stages) NC's API + the n8n REST API, and asserts both
# sides. Its BUILT-IN junit formatter emits JUnit XML, which the same
# EnricoMi reporter the unit suite uses turns into a sticky PR comment + summary.
#
# Setup follows the official apps: check out nextcloud/server, mount this app
# into apps/n8n_sync, install on SQLite. n8n runs as a GHA services: container
# (pre-built image — the services feature fits it). docker-compose.yaml is NOT
# used in CI (devcontainer only; saga §4a).

on:
  pull_request:
    branches:
    - main
    paths:
    - .github/workflows/integration.yml
    - appinfo/**
    - lib/**
    - templates/**
    - features/**
    - tests/integration/**
    - composer.json
  push:
    branches:
    - main

permissions:
  contents: read
  # Behat results → sticky PR comment + check run (EnricoMi), like the unit suite.
  checks: write
  pull-requests: write

concurrency:
  group: integration-${{ github.ref }}
  cancel-in-progress: true

# Static values here so `run:` steps are pure bash reading $VARS — never inline
# `${{ }}` templating (see CONTRIBUTING.md "Workflow authoring conventions").
env:
  APP_ID: n8n_sync
  N8N_URL: http://localhost:5678
  NC_ADMIN_USER: admin
  NC_ADMIN_PASS: admin

jobs:

  integration:
    name: Integration Tests
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        # NC 33 is the app's max-version; SQLite is the fast integration path.
        server-versions: ['stable33']

    services:
      # n8n with the instance owner pre-provisioned via env (no signup wizard,
      # saga §4a.1) — a background container via the GHA services feature.
      n8n:
        image: docker.n8n.io/n8nio/n8n:latest
        ports:
        - 5678:5678
        env:
          N8N_INSTANCE_OWNER_MANAGED_BY_ENV: "true"
          N8N_INSTANCE_OWNER_EMAIL: owner@example.com
          N8N_INSTANCE_OWNER_FIRST_NAME: Test
          N8N_INSTANCE_OWNER_LAST_NAME: Owner
          # bcrypt hash of "n8npassword" (see .env.example).
          N8N_INSTANCE_OWNER_PASSWORD_HASH: $2y$12$M/JhYL51spvMK3uMO8iraOSbWKqIkLldhcaA8Y2TzPAhZVQdV0Tju
          N8N_DIAGNOSTICS_ENABLED: "false"
          N8N_HIRING_BANNER_ENABLED: "false"
        options: >-
          --health-cmd "wget -q -O - http://localhost:5678/healthz | grep -q ok"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 40
          --health-start-period 20s

    steps:
    # ── Provision: install everything up front, before any action runs ───────
    - name: Checkout server
      uses: actions/checkout@v7
      with:
        repository: nextcloud/server
        ref: ${{ matrix.server-versions }}
        submodules: true

    - name: Checkout app into apps/
      uses: actions/checkout@v7
      with:
        path: apps/${{ env.APP_ID }}

    - name: Set up PHP
      uses: shivammathur/setup-php@v2
      with:
        # Match the production pod / the rest of our CI.
        php-version: '8.4'
        extensions: mbstring, iconv, fileinfo, intl, sqlite, pdo_sqlite, gd, zip, curl, xml
        coverage: none
        tools: composer:v2

    - name: Install Behat deps
      working-directory: apps/${{ env.APP_ID }}/tests/integration
      run: composer install --prefer-dist --no-progress

    - name: Install Nextcloud (SQLite)
      run: |
        mkdir -p data
        ./occ maintenance:install \
          --database=sqlite \
          --admin-user="$NC_ADMIN_USER" \
          --admin-pass="$NC_ADMIN_PASS"
        ./occ config:system:set trusted_domains 1 --value=localhost

    # ── Readiness: wait for the n8n service container ────────────────────────
    - name: Wait for n8n
      run: |
        for i in $(seq 1 40); do
          if curl -fsS "$N8N_URL/healthz" | grep -q ok; then echo "n8n healthy"; exit 0; fi
          sleep 3
        done
        echo "n8n did not become healthy" >&2; exit 1

    # ── Act: everything provisioned and ready — now do the work ──────────────
    # PREREQUISITE (not a feature): obtain a valid n8n API key so the tests can
    # act as an admin who already has one. How the key is created is out of the
    # app's scope — this is pure test setup. Fails the job loudly if no key, so
    # we never run the suite without one. The key is exposed as a step output for
    # later steps; it is NOT stored anywhere.
    - name: Mint n8n API key (prerequisite)
      id: n8n_key
      env:
        N8N_OWNER_EMAIL: owner@example.com
        N8N_OWNER_PASSWORD: n8npassword
      run: |
        key="$(bash apps/$APP_ID/tests/integration/bin/mint-n8n-key.sh)"
        if [ -z "$key" ]; then echo "no API key minted" >&2; exit 1; fi
        echo "::add-mask::$key"
        echo "key=$key" >> "$GITHUB_OUTPUT"
        echo "✅ n8n API key obtained (length ${#key})"

    # Behat runs from the integration dir; OCC points back at the server root so
    # `occ` resolves. Formatters (pretty → stdout, junit → junit/) are configured
    # in behat.dist.yml, so no --format flags needed here.
    - name: Run Behat
      working-directory: apps/${{ env.APP_ID }}/tests/integration
      env:
        OCC: php ${{ github.workspace }}/occ
        NC_BASE_URL: http://localhost:8080
        # The minted key, available to scenarios as an "admin already has a key".
        N8N_API_KEY: ${{ steps.n8n_key.outputs.key }}
      run: vendor/bin/behat --config behat.dist.yml

    - name: Publish integration results
      if: always()
      uses: EnricoMi/publish-unit-test-result-action@v2
      with:
        check_name: Integration test results
        files: apps/${{ env.APP_ID }}/tests/integration/junit/*.xml
        comment_mode: always

    - name: Upload JUnit + NC log on failure
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: integration-junit
        path: |
          apps/${{ env.APP_ID }}/tests/integration/junit/*.xml
        if-no-files-found: warn

    - name: Nextcloud log on failure
      if: failure()
      run: |
        if [ -f data/nextcloud.log ]; then cat data/nextcloud.log; else echo "no log"; fi
