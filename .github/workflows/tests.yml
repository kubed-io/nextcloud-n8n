name: 🧪 Tests

# Build + lint + unit tests, split by language into two parallel jobs (PHP / JS)
# so a failure points straight at the language and the two don't block each
# other. Runs on every PR into main (and pushes to main so the badge tracks
# trunk). Needs no services — the integration / e2e layers (Chapter 2 §4a
# docker-compose stack) come later as their own workflow.

on:
  pull_request:
    branches:
    - main
  push:
    branches:
    - main

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:

  php:
    name: PHP lint & unit test
    runs-on: ubuntu-latest
    steps:

    - name: Checkout
      uses: actions/checkout@v6

    - name: Setup PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: '8.3'
        coverage: none
        tools: composer:v2

    - name: Install PHP dependencies
      run: composer install --prefer-dist --no-progress

    - name: Lint PHP (php -l)
      run: find lib -name '*.php' -print0 | xargs -0 -n1 -P4 php -l

    - name: Unit tests
      run: composer run test:unit

  js:
    name: JS build
    runs-on: ubuntu-latest
    steps:

    - name: Checkout
      uses: actions/checkout@v6

    - name: Setup Node
      uses: actions/setup-node@v5
      with:
        node-version-file: .nvmrc
        cache: npm

    - name: Install JS dependencies
      run: npm ci

    # If it doesn't build there's nothing worth shipping — this is the JS gate.
    - name: Build bundle
      run: npm run build
