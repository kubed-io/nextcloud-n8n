name: 🛡️ Quality

# Slower / advisory quality gates kept out of the fast test loop, split by
# language the same way tests.yml is. Same triggers so every PR into main is
# gated.
#
# PHP job: dependency audit + static analysis (php-cs-fixer + Psalm). CodeQL has
#   no PHP support (PHP is the only top-10 language CodeQL does not analyse), so
#   Psalm is the PHP static-analysis gate.
# JS job:  dependency audit + CodeQL (javascript-typescript) at the end.
#
# These checks are the standing edge of the Chapter 2 §12 "refactor pass" — an
# ongoing gate, not a one-off cleanup.

on:
  pull_request:
    branches:
    - main
  push:
    branches:
    - main

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:

  php:
    name: PHP audit & static analysis
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
    - name: Checkout
      uses: actions/checkout@v6

    - name: Setup PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: '8.4'
        coverage: none
        tools: composer:v2

    - name: Install PHP dependencies
      run: composer install --prefer-dist --no-progress

    - name: Audit composer dependencies
      run: composer audit

    - name: Coding standard (php-cs-fixer)
      run: composer run cs:check

    - name: Static analysis (Psalm)
      run: vendor/bin/psalm --no-cache --threads=4

  js:
    name: JS audit & CodeQL
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
    - name: Checkout
      uses: actions/checkout@v6

    - name: Setup Node
      uses: actions/setup-node@v5
      with:
        node-version-file: .nvmrc
        cache: npm

    - name: Install JS dependencies
      run: npm ci

    - name: Audit npm dependencies
      run: npm audit --omit=dev --audit-level=high

    - name: Initialize CodeQL
      uses: github/codeql-action/init@v4
      with:
        languages: javascript-typescript
        queries: security-and-quality

    - name: Perform CodeQL analysis
      uses: github/codeql-action/analyze@v4
      with:
        category: /language:javascript-typescript
