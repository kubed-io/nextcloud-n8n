# Behat config for the n8n_sync integration suite.
#
# Behat is the Nextcloud-native integration framework (see nextcloud/deck). It
# drives a *running* Nextcloud (over HTTP / occ) and the n8n service, and asserts
# both sides — the real wiring the unit suite mocks out (saga §5).
#
# Output: Behat's BUILT-IN junit formatter (no third-party dep) writes JUnit XML
# to junit/, which the integration workflow feeds to the same EnricoMi reporter
# the unit suite uses → sticky PR comment + job summary.
#
# Env the FeatureContext reads (set by the workflow / local runner):
#   NC_BASE_URL, NC_ADMIN_USER, NC_ADMIN_PASS, N8N_URL, OCC

default:
  # Four status tags, four reasons a scenario is not live — see features/README.md.
  # All four are skipped here, so CI runs exactly the scenarios that claim to be
  # live; splitting them changes NOTHING about what runs, and everything about
  # whether "what is built but untested?" can be answered with a filter:
  #
  #   @todo     the code exists, only the test is missing  ← the work queue
  #   @unbuilt  a spec awaiting code
  #   @blocked  real behaviour this harness cannot reach (must name what is missing)
  #   @decision a deliberate absence; there is no operation to test
  #
  # `behat --tags @todo` is therefore a real backlog rather than a junk drawer.
  gherkin:
    filters:
      tags: '~@todo&&~@unbuilt&&~@blocked&&~@decision'

  suites:
    default:
      paths:
        # Gherkin lives at the repo root (features/) so the human-readable use
        # cases are prominent and linkable from docs; behat.dist.yml stays under
        # tests/integration/ with the rest of the test plumbing.
        - '%paths.base%/../../features'
      contexts:
        # Context class lives with the test code (tests/integration/bootstrap/),
        # loaded via the integration composer autoload — features/ stays pure
        # Gherkin.
        - OCA\N8nSync\Tests\Integration\FeatureContext

  formatters:
    # Human-readable progress in the log…
    pretty:
      verbose: true
    # …and machine-readable JUnit for the CI reporter.
    junit:
      output_path: '%paths.base%/junit'
