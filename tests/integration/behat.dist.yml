# Behat config for the n8n_sync integration suite.
#
# Behat is the Nextcloud-native integration framework (see nextcloud/deck). It
# drives a *running* Nextcloud (over HTTP / occ) and the n8n service, and asserts
# both sides — the real wiring the unit suite mocks out (saga §5).
#
# Output: Behat's BUILT-IN junit formatter (no third-party dep) writes JUnit XML
# to junit/, which the integration workflow feeds to the same EnricoMi reporter
# the unit suite uses → sticky PR comment + job summary.
#
# Env the FeatureContext reads (set by the workflow / local runner):
#   NC_BASE_URL, NC_ADMIN_USER, NC_ADMIN_PASS, N8N_URL, OCC

default:
  # Four status tags, four reasons a scenario is not live — see features/README.md.
  # All four are skipped here, so CI runs exactly the scenarios that claim to be
  # live; splitting them changes NOTHING about what runs, and everything about
  # whether "what is built but untested?" can be answered with a filter:
  #
  #   @todo     the code exists, only the test is missing  ← the work queue
  #   @unbuilt  a spec awaiting code
  #   @blocked  real behaviour this harness cannot reach (must name what is missing)
  #   @decision a deliberate absence; there is no operation to test
  #
  # `behat --tags @todo` is therefore a real backlog rather than a junk drawer.
  gherkin:
    filters:
      tags: '~@todo&&~@unbuilt&&~@blocked&&~@decision'

  # FIVE SUITES, AND THEY ARE A PARTITION — every feature file belongs to exactly
  # one. `bin/check-suites.sh` enforces that mechanically, because the failure
  # mode of getting it wrong is SILENT: a file in no suite is simply never run,
  # and a green build says so confidently.
  #
  # Running plain `behat` runs all five in sequence, which is exactly the old
  # single-suite coverage — the split is inert until something selects a suite.
  # That is deliberate: it lets CI prove the partition covers everything BEFORE
  # the workflow starts depending on it (`behat --suite=tags` per matrix leg).
  #
  # THE AXIS IS THE FILENAME, NOT A TAG. Tags look like the obvious split and are
  # the wrong tool: `@occ`, `@ui` and `@in-n8n` are carried by some scenarios and
  # not others, so any tag partition leaks — the untagged ones would match no leg
  # and quietly stop running, with every leg still green. A path partition cannot
  # leak, because `ls features/*.feature` minus the union must be empty and that
  # is one line to check.
  #
  #   admin     the settings surface — the connection and the mapping list.
  #             Grouped because admin work is a different SESSION from user work,
  #             not merely a different tag; it never interleaves with a gesture.
  #   authoring the verbs that MAKE or CHANGE a workflow: create, copy, edit, rename.
  #             They all end with a workflow that exists and differs from before.
  #   lifecycle the verbs that move a workflow between STATES rather than change its
  #             content: delete, restore, purge, move. Every one of them is a round
  #             trip through n8n's archive or a mapping boundary, which is why they
  #             are the slow half — `workflow` was one 7-minute leg and is now two.
  #             Splitting on "does this change the workflow, or where it lives?" keeps
  #             a scenario's home obvious, which a by-runtime split would not.
  #   tags      the tag is n8n's only grouping construct — it is what a mapping
  #             binds to and what decides a workflow's membership. Everything
  #             about the tag vocabulary and the three-way sync lives here, and it
  #             is the largest single body of scenarios in the repo.
  #   core      what is not a verb on a file and not about tags: identity, file
  #             type, the FIRST sync, purge, and the app lifecycle.
  suites:
    admin:
      paths:
      - '%paths.base%/../../features/connection/connection.feature'
      - '%paths.base%/../../features/connection/sync-now.feature'
      - '%paths.base%/../../features/mapping/create.feature'
      - '%paths.base%/../../features/mapping/delete.feature'
      - '%paths.base%/../../features/mapping/manage-groups.feature'
      contexts: &contexts
      - OCA\N8nSync\Tests\Integration\FeatureContext

    authoring:
      paths:
      - '%paths.base%/../../features/workflows/create.feature'
      - '%paths.base%/../../features/workflows/copy.feature'
      - '%paths.base%/../../features/workflows/edit.feature'
      - '%paths.base%/../../features/workflows/rename.feature'
      contexts: *contexts

    lifecycle:
      paths:
      - '%paths.base%/../../features/workflows/delete.feature'
      - '%paths.base%/../../features/workflows/restore.feature'
      - '%paths.base%/../../features/workflows/purge.feature'
      - '%paths.base%/../../features/workflows/move.feature'
      contexts: *contexts

    tags:
      paths:
      - '%paths.base%/../../features/workflows/tags.feature'
      contexts: *contexts

    core:
      paths:
      - '%paths.base%/../../features/workflows/view.feature'
      - '%paths.base%/../../features/workflows/open-with.feature'
      - '%paths.base%/../../features/lifecycle.feature'
      contexts: *contexts

  formatters:
    # Human-readable progress in the log…
    pretty:
      verbose: true
    # …and machine-readable JUnit for the CI reporter.
    junit:
      output_path: '%paths.base%/junit'
