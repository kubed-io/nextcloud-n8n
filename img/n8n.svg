<?xml version="1.0" encoding="UTF-8"?>
<!--
  SPDX-FileCopyrightText: 2026 Kelly Ferrone
  SPDX-License-Identifier: AGPL-3.0-or-later

  Filetype icon for application/n8n+json (.n8n.json files).
  Square SVG sized to match Nextcloud's other 32x32 filetype glyphs in
  core/img/filetypes/. Two filled circles + a connector echo n8n's node-graph
  visual without leaning on the brand wordmark. currentColor lets Nextcloud's
  CSS recolor it to match the active theme.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
  <rect x="2" y="2" width="28" height="28" rx="3" fill="#fff" opacity="0.0"/>
  <circle cx="9" cy="16" r="4" fill="#ea4b71" stroke="none"/>
  <circle cx="23" cy="16" r="4" fill="#ea4b71" stroke="none"/>
  <line x1="13" y1="16" x2="19" y2="16" stroke="#ea4b71" stroke-width="2.5"/>
  <line x1="9" y1="12" x2="9" y2="6" stroke="#ea4b71" stroke-width="2.5"/>
  <line x1="9" y1="20" x2="9" y2="26" stroke="#ea4b71" stroke-width="2.5"/>
  <line x1="23" y1="12" x2="23" y2="6" stroke="#ea4b71" stroke-width="2.5"/>
  <line x1="23" y1="20" x2="23" y2="26" stroke="#ea4b71" stroke-width="2.5"/>
</svg>
